[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.17,<0.10" ]

[project]
name = "performer"
version = "0.1.1"
description = "Personal DDSP"
readme = "README.md"
authors = [ { name = "kureta", email = "kureta@kureta.xyz" } ]
requires-python = ">=3.9,<3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
]
dependencies = [
  "beartype>=0.10.4",
  "dvc[s3,ssh]>=2.18",
  # Project specific
  "einops>=0.4.1",
  "hydra-colorlog>=1.2",
  # Hydra ecosystem
  "hydra-core>=1.2",
  "hydra-optuna-sweeper>=1.2",
  "hydra-zen>=0.7.1",
  "jupyter>=1",
  "librosa>=0.9.2",
  "matplotlib>=3.5.3",
  "numpy>=1.22.4,<2",                                          # Crucial: numpy 2.x breaks compiled torch 1.12 wheels
  "pre-commit",
  "pydantic>=1.9.2,<2",                                        # Crucial: hydra-zen and older lightning break on pydantic v2
  # Utilities (cap modern releases to keep Python 3.9 compatibility)
  "pyrootutils",
  "pytest",
  "pytorch-lightning>=1.6.5,<1.9.0",
  "rich<14",
  "setuptools<70.0.0",                                                # Required for older pytorch-lightning pkg_resources imports
  "sh",
  "streamlit>=1.12.2",
  # Align PyTorch 1.12.1 ecosystem
  "torch>=1.12.1",
  "torchaudio>=0.12.1",
  "torchcrepe @ git+https://github.com/kureta/torchcrepe.git",
  "torchmetrics>=0.9.2",
  "torchvision>=0.13.1",
  "tqdm>=4.64",
  # Loggers
  "wandb>=0.13.1",
]

[tool.uv]
sources.torchcrepe = { git = "https://github.com/kureta/torchcrepe.git" }
required-environments = "sys_platform == 'darwin' and platform_machine == 'arm64'"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = "tests/"
ini_options.addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
ini_options.markers = [
  "slow: slow tests",
]
ini_options.filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
ini_options.log_cli = "True"

[tool.coverage]
report.exclude_lines = [
  "if __name__ == .__main__.:",
  "pragma: nocover",
  "raise NotImplementedError",
  "raise NotImplementedError()",
]
